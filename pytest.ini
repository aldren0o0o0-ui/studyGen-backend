[pytest]
testpaths = tests
asyncio_mode = strict
addopts = --basetemp=temp_pytest
tmp_path_retention_policy = none
markers =
    postgres_integration: PostgreSQL integration tests
    redis_integration: Redis integration tests
    concurrency: Concurrency tests
    migration_integration: Migration tests
    backup_restore: Backup & restore tests
    social_foundation: Phase 11A social foundation tests
    social_interactions: Phase 11B social interaction tests
    social_performance: Explicit Phase 11B.1 representative PostgreSQL performance tests
    moderation: Phase 11D trust, safety, and moderation tests
    security: Security and privilege-escalation certification tests
    admin: Phase 12A administration tests
    admin_performance: opt-in Phase 12A administration performance tests
filterwarnings =
    error
    ignore::FutureWarning:google.api_core.*
    ignore::ResourceWarning:anyio
    ignore:.*MemoryObjectReceiveStream.*:ResourceWarning
    ignore:.*MemoryObjectSendStream.*:ResourceWarning
    ignore::pytest.PytestUnraisableExceptionWarning

